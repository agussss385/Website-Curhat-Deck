<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CurhatDeck — Ruang Konseling Mahasiswa</title>
  <style>
    :root {
      --bg: #eef2f7;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #059669;
      --success-hover: #047857;
      --border: #e2e8f0;
      --pending-bg: #fef3c7;
      --pending-text: #92400e;
      --approved-bg: #dcfce7;
      --approved-text: #166534;
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 220px);
      color: var(--text);
      padding: 28px 16px 48px;
    }

    .app-shell {
      max-width: 980px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 22px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.05);
      margin-bottom: 22px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      margin: 4px 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .nav-tabs {
      display: inline-flex;
      background: var(--surface-soft);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
      gap: 4px;
    }

    .nav-tab {
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 9px 16px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-tab.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.28);
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.05);
    }

    .panel-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    .panel-header p {
      margin: 4px 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.94rem;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
    }

    .btn-submit {
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
    }

    .booking-stack {
      display: grid;
      gap: 14px;
    }

    .booking-card {
      border: 1px solid var(--border);
      background: var(--surface-soft);
      border-radius: 14px;
      padding: 18px;
    }

    .booking-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .booking-id {
      font-weight: 700;
      color: var(--primary);
    }

    .status-pill {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .status-pending {
      background: var(--pending-bg);
      color: var(--pending-text);
    }

    .status-approved {
      background: var(--approved-bg);
      color: var(--approved-text);
    }

    .booking-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 6px 14px;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .booking-topic {
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .meet-bar {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #cbd5e1;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .meet-bar select {
      min-width: 130px;
      padding: 9px 11px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: var(--surface);
      font-size: 0.9rem;
    }

    .meet-bar input {
      flex: 1;
      min-width: 230px;
      padding: 9px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: var(--surface);
      font-size: 0.9rem;
    }

    .btn-save-send {
      background: var(--success);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-save-send:hover {
      background: var(--success-hover);
    }

    .btn-save-send:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .alert {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      display: none;
    }

    .alert.show-success {
      display: block;
      background: var(--approved-bg);
      color: var(--approved-text);
    }

    .alert.show-error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      font-size: 0.92rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1 class="brand-title">CurhatDeck</h1>
        <p class="brand-subtitle">Layanan Booking & Konfirmasi Sesi Konseling</p>
      </div>
      <nav class="nav-tabs" aria-label="Pilihan Peran">
        <button type="button" id="tab-student" class="nav-tab active">Mahasiswa</button>
        <button type="button" id="tab-counselor" class="nav-tab">Konselor</button>
      </nav>
    </header>

    <!-- Panel Mahasiswa -->
    <main id="panel-student" class="panel">
      <div class="panel-header">
        <div>
          <h2>Formulir Booking Konseling</h2>
          <p>Isi data jadwal agar permintaan sesi tercatat dan notifikasi awal terkirim.</p>
        </div>
      </div>

      <form id="student-booking-form">
        <div class="grid-2">
          <div class="field">
            <label for="input-name">Nama Lengkap</label>
            <input type="text" id="input-name" required placeholder="Contoh: Dylan Putra" />
          </div>
          <div class="field">
            <label for="input-email">Email Aktif</label>
            <input type="email" id="input-email" required placeholder="nama@email.com" />
          </div>
          <div class="field">
            <label for="input-faculty">Jurusan / Prodi</label>
            <input type="text" id="input-faculty" required placeholder="Contoh: Desain / TI" />
          </div>
          <div class="field">
            <label for="input-mode">Mode Sesi</label>
            <select id="input-mode">
              <option value="Online">Online</option>
              <option value="Offline">Offline</option>
            </select>
          </div>
          <div class="field">
            <label for="input-date">Tanggal</label>
            <input type="date" id="input-date" required />
          </div>
          <div class="field">
            <label for="input-time">Jam (WIB)</label>
            <input type="time" id="input-time" required />
          </div>
          <div class="field">
            <label for="input-location">Tempat / Ruang Konseling</label>
            <input type="text" id="input-location" value="Online (Google Meet)" />
          </div>
        </div>

        <div class="field">
          <label for="input-topic">Topik Konseling</label>
          <textarea id="input-topic" rows="3" required placeholder="Tuliskan topik atau hal yang ingin didiskusikan..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Permintaan</button>
      </form>

      <div id="student-alert" class="alert"></div>
    </main>

    <!-- Panel Konselor -->
    <section id="panel-counselor" class="panel hidden">
      <div class="panel-header">
        <div>
          <h2>Dashboard Konselor</h2>
          <p>Tempel link Google Meet pada sesi Online, lalu klik Simpan & Kirim untuk menyetujui dan mengirim ke Gmail.</p>
        </div>
      </div>

      <div id="counselor-alert" class="alert"></div>
      <div id="counselor-list" class="booking-stack"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
